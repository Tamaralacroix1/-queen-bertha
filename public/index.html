<!doctype html><html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff"><title>Queen Bertha 👑</title>
<script src="vendor/marked.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1f1f1f;--muted:#6b6b6b;--bubble:#f1f1f1;--line:#e6e6e6;--accent:#111;--accentfg:#fff;--rec:#e5383b}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--fg:#ececec;--muted:#a3a3a3;--bubble:#2a2a2a;--line:#333;--accent:#ececec;--accentfg:#111}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:20px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
header h1{font-size:18px;font-weight:600;margin:0}
.ib{border:none;background:none;color:var(--fg);min-width:48px;height:48px;border-radius:12px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px}
.ib:active{background:var(--bubble)}.ib svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;padding:16px 14px 8px}
.thread{max-width:760px;margin:0 auto}
.empty{text-align:center;padding:12vh 8px 0}
.empty .crown{font-size:52px}.empty h2{font-size:25px;font-weight:600;margin:8px 0 26px;line-height:1.3}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;padding:14px 12px;font:inherit;font-size:17px;text-align:left;cursor:pointer;min-height:64px}
.chip:active{background:var(--bubble)}
.msg{margin:14px 0}.user{display:flex;justify-content:flex-end}
.user .b{background:var(--bubble);border-radius:22px;padding:10px 16px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.user .b .v{font-size:14px;color:var(--muted);display:block}
.bot .t{word-wrap:break-word}.bot .t p{margin:0 0 .7em}.bot .t ol,.bot .t ul{padding-left:1.3em}
.en{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;white-space:pre-wrap}
.en small{display:block;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.bot img{width:100%;max-width:480px;border-radius:16px;display:block;margin:6px 0}
.tools{display:flex;gap:2px;margin-left:-10px;color:var(--muted)}.tools .ib{color:var(--muted)}
.typing{display:flex;gap:6px;padding:12px 2px}.typing i{width:10px;height:10px;border-radius:50%;background:var(--muted);animation:d 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.25}40%{opacity:1}}
footer{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.comp{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:28px;padding:6px 6px 6px 18px;background:var(--bg);box-shadow:0 2px 12px #0000000f}
textarea{flex:1;border:none;outline:none;resize:none;background:none;color:var(--fg);font:inherit;max-height:160px;padding:10px 0;min-width:0}
.round{width:56px;height:56px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--accent);color:var(--accentfg)}
.round svg{width:28px;height:28px}
#mic.rec{background:var(--rec);color:#fff;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #e5383b80}100%{box-shadow:0 0 0 16px #e5383b00}}
#send{display:none}.has #send{display:grid}.has #mic{display:none}
#status{text-align:center;font-size:15px;color:var(--muted);min-height:22px;margin-top:4px}
.err{color:var(--rec)}
</style></head><body>
<header><h1>Queen Bertha 👑</h1>
<button class="ib" id="new" aria-label="Nouvo chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nouvo</button></header>
<main id="main"><div class="thread" id="thread"></div></main>
<footer><form class="comp" id="form">
<textarea id="t" rows="1" placeholder="Ekri oswa peze mikwo a…"></textarea>
<button type="button" class="round" id="mic" aria-label="Pale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button type="submit" class="round" id="send" aria-label="Voye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</form><div id="status"></div></footer>
<script>
const $=id=>document.getElementById(id),thread=$('thread'),main=$('main'),ta=$('t'),form=$('form'),st=$('status');
const KEY='qb-chat-v2';let msgs=JSON.parse(localStorage.getItem(KEY)||'[]');
let uid=localStorage.getItem('qb-uid');if(!uid){uid='u'+Math.random().toString(36).slice(2);localStorage.setItem('qb-uid',uid)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(msgs))}catch(e){localStorage.setItem(KEY,JSON.stringify(msgs.map(m=>({...m,img:null,audio:null}))))}};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const md=s=>window.marked?marked.parse(esc(s),{breaks:true}):esc(s).replace(/\n/g,'<br>');
const I={copy:'<path d="M8 8h11v11H8z"/><path d="M5 16V5h11"/>',speak:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
 wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/>',save:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',ok:'<path d="M5 12l5 5 9-10"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const CHIPS=[['✉️','Ede m ekri yon imel an Anglè'],['📚','Ban m yon plan leson pou elèv mwen'],['🎨','Fè yon foto yon bèl jaden flè'],['📖','Ban m yon vèsè biblik pou jodi a']];
function render(){thread.innerHTML='';
 if(!msgs.length){thread.innerHTML=`<div class="empty"><div class="crown">👑</div><h2>Bonjou Queen Bertha 👑,<br>kisa m ka fè pou ou jodi a?</h2><div class="chips">${CHIPS.map(c=>`<button class="chip">${c[0]} ${c[1]}</button>`).join('')}</div></div>`;
  thread.querySelectorAll('.chip').forEach((b,i)=>b.onclick=()=>send(CHIPS[i][1]));return}
 msgs.forEach((m,i)=>thread.appendChild(node(m,i)));scroll()}
function node(m,i){const d=document.createElement('div');d.className='msg '+m.role;
 if(m.role==='user'){d.innerHTML=`<div class="b">${m.voice?'<span class="v">🎙️ Mesaj vokal</span>':''}${esc(m.text)}</div>`;return d}
 if(m.typing){d.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';return d}
 if(m.error){d.innerHTML=`<div class="t err">${esc(m.text)}</div>`;return d}
 let h=`<div class="t">${md(m.text)}</div>`;
 if(m.en)h+=`<div class="en"><small>An Anglè</small>${esc(m.en)}</div>`;
 if(m.img)h+=`<img alt="${esc(m.cap)}" src="data:image/png;base64,${m.img}">`;
 h+=`<div class="tools"><button class="ib" data-a="copy" aria-label="Kopye">${svg('copy')}</button><button class="ib" data-a="speak" aria-label="Li fò">${svg('speak')}</button><button class="ib" data-a="wa" aria-label="WhatsApp">${svg('wa')}</button>${m.img?`<button class="ib" data-a="save" aria-label="Sove foto">${svg('save')}</button>`:''}</div>`;
 d.innerHTML=h;d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,m,b));return d}
const scroll=()=>requestAnimationFrame(()=>main.scrollTop=main.scrollHeight);
const plain=m=>m.text+(m.en?'\n\n'+m.en:'');
async function blobOf(m){return (await fetch('data:image/png;base64,'+m.img)).blob()}
let audioEl=null;
function stopAudio(){if(audioEl){audioEl.pause();audioEl=null}speechSynthesis&&speechSynthesis.cancel()}
function browserSpeak(text){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text),vs=speechSynthesis.getVoices();
 const v=vs.find(v=>/^ht/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang));if(v){u.voice=v;u.lang=v.lang}else u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}
async function speak(m){stopAudio();
 if(!m.audio&&!mockMode){st.textContent='Ap prepare vwa a…';try{const r=await fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:m.text})});m.audio=(await r.json()).audio}catch(e){}st.textContent=''}
 if(m.audio){audioEl=new Audio('data:audio/mpeg;base64,'+m.audio);audioEl.play().catch(()=>{})}else browserSpeak(m.text)}
async function act(a,m,b){
 if(a==='copy'){await navigator.clipboard.writeText(m.en||plain(m)).catch(()=>{});b.innerHTML=svg('ok');setTimeout(()=>b.innerHTML=svg('copy'),1500)}
 if(a==='speak')speak(m);
 if(a==='wa'){const text=plain(m);try{if(m.img){const f=new File([await blobOf(m)],'foto.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f],text:m.cap||text})}
  if(navigator.share)return await navigator.share({text})}catch(e){if(e.name==='AbortError')return}
  open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
 if(a==='save'){const u=URL.createObjectURL(await blobOf(m)),l=document.createElement('a');l.href=u;l.download='queen-bertha-foto.png';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}}
let busy=false,mockMode=false;
fetch('/health').then(r=>r.json()).then(j=>mockMode=!!j.mock).catch(()=>{});
async function send(text,audio){if(busy)return;text=(text||'').trim();if(!text&&!audio)return;busy=true;stopAudio();
 let um=null;if(text){um={role:'user',text};msgs.push(um)}
 const tm={role:'bot',typing:true};msgs.push(tm);render();
 try{const r=audio?await fetch('/message?userId='+uid,{method:'POST',headers:{'Content-Type':audio.type||'audio/webm'},body:audio})
   :await fetch('/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,text})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Erè');
  msgs.pop();if(audio)msgs.push({role:'user',text:j.transcript_creole||'…',voice:true});
  const bm={role:'bot',text:j.reply_creole||'',en:j.english_text||'',img:j.image&&j.image.png_base64,cap:j.image&&j.image.caption,audio:j.reply_audio_mp3_base64};
  msgs.push(bm);save();render();if(audio)speak(bm)}
 catch(e){msgs.pop();msgs.push({role:'bot',error:true,text:'Padon, gen yon pwoblèm. Eseye ankò. ('+e.message+')'});render()}
 busy=false}
form.onsubmit=e=>{e.preventDefault();const v=ta.value;ta.value='';grow();send(v)};
ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};
function grow(){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';form.classList.toggle('has',!!ta.value.trim())}ta.oninput=grow;
$('new').onclick=()=>{stopAudio();msgs=[];save();render();fetch('/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,text:'',reset:true})}).catch(()=>{});uid='u'+Math.random().toString(36).slice(2);localStorage.setItem('qb-uid',uid)};
let rec=null,chunks=[];const mic=$('mic');
mic.onclick=async()=>{if(rec&&rec.state==='recording'){rec.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());mic.classList.remove('rec');st.textContent='';const b=new Blob(chunks,{type:(rec.mimeType||'audio/webm').split(';')[0]});if(b.size>800)send('',b)};
  rec.start();mic.classList.add('rec');st.textContent='🔴 Ap koute… peze ankò pou fini'}
 catch(e){st.textContent='Mikwo a pa disponib. Ou ka ekri.'}};
render();
</script></body></html>
